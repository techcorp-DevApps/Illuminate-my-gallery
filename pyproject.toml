[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "illuminate-portal-system"
version = "0.1.0"
description = "Portal system implementation for Illuminate-my-gallery"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100

'target-version' = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
