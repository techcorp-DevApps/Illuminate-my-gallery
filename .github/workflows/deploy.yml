name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-railway:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g @railway/cli
      - name: Deploy API service
        run: railway up --service api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy WEB service
        run: railway up --service web
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-render-fallback:
    runs-on: ubuntu-latest
    needs: deploy-railway
    if: ${{ failure() }}
    environment: production
    steps:
      - name: Trigger Render deploy hook (API)
        run: curl -fsSL -X POST "$RENDER_API_DEPLOY_HOOK"
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
      - name: Trigger Render deploy hook (WEB)
        run: curl -fsSL -X POST "$RENDER_WEB_DEPLOY_HOOK"
        env:
          RENDER_WEB_DEPLOY_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}

  smoke-check:
    runs-on: ubuntu-latest
    needs:
      - deploy-railway
    if: ${{ success() }}
    steps:
      - uses: actions/checkout@v4
      - name: Run deployment smoke checks
        run: bash scripts/deployment-smoke-check.sh
        env:
          API_URL: ${{ secrets.PROD_API_URL }}
          WEB_URL: ${{ secrets.PROD_WEB_URL }}
